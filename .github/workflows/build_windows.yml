name: Build NMH Karaoke Windows PC Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows Desktop & Set App Icon
        run: |
          if (Test-Path "main.dart") { Move-Item -Force "main.dart" "lib/main.dart" }
          if (Test-Path "db_ssd_service.dart") { Move-Item -Force "db_ssd_service.dart" "lib/services/db_ssd_service.dart" }
          flutter create --platforms=windows --project-name nmh_karaoke_server .
          flutter config --enable-windows-desktop
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Windows Release EXE
        run: |
          flutter build windows --release

      - name: Upload Windows PC Server ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NMH_Karaoke_PC_Server_Win64
          path: build/windows/x64/runner/Release/

